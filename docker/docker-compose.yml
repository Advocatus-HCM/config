services:
  advocatus_web:
    container_name: advocatus_web
    build:
      context: ../../advocatus_web
      dockerfile: Dockerfile
    ports:
      - '3000:5173'
    volumes:
      - '../../advocatus_web/:/app'

  advocatus_personal_manager_ms:
    container_name: advocatus_personal_manager_ms
    build:
      context: ../../advocatus_personal_manager_ms
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    volumes:
      - '../../advocatus_personal_manager_ms/:/app'
    depends_on:
      - advocatus_personal_manager_db

  advocatus_personal_manager_db:
    container_name: advocatus_personal_manager_db
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PERSONAL_MANAGER_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PERSONAL_MANAGER_DB_PASSWORD}
      MONG_INITDB_DATABASE: ${PERSONAL_MANAGER_DB}
    ports:
      - '27017:27017'
    volumes:
      - '../../advocatus_personal_manager_ms/database:/data/db'

  advocatus_authentification_ms:
    container_name: advocatus_authentificator_ms
    build:
      context: ../../advocatus_authentificator_ms
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../advocatus_authentificator_ms/.env 
    volumes:
      - "../../advocatus_authentificator_ms/app:/app/app"
    depends_on:
      - advocatus_authentificator_db
    entrypoint: ["wait-for-it", "advocatus_authentificator_db:3306", "--", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  advocatus_authentificator_db:
    container_name: advocatus_authentificator_db
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql   

  advocatus_api_gateway_ms:
    container_name: advocatus_api_gateway_ms
    build:
      context: ../../advocatus_api_gateway
      dockerfile: Dockerfile
    environment:
      AUTH_MS_URL: http://advocatus_authentification_ms:8000
      PERSONAL_MANAGER_MS_URL: http://advocatus_personal_manager_ms:8001 
    ports:
      - "4000:4000"
    volumes:
      - '../../advocatus_api_gateway/:/app'
    depends_on:
      - advocatus_authentification_ms
      - advocatus_personal_manager_ms

volumes:
  db_data: