services:
  advocatus_authentification_ms:
    container_name: advocatus_authentificator_ms
    build:
      context: ../../advocatus_authentificator_ms
      dockerfile: ../config/docker/advocatus_authentificator_ms/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - "../../advocatus_authentificator_ms/app:/app/app"    # Mount local `app` directory into `/app` inside the container
    depends_on:
      - advocatus_authentificator_db  # Ensure the db service is up before the application starts
    networks:
      - autenticador_network  # Use the shared network
    entrypoint: ["wait-for-it", "advocatus_authentificator_db:3306", "--", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  advocatus_authentificator_db:
    container_name: advocatus_authentificator_db
    image: mysql:8.0  # Use the MySQL 8.0 image
    environment:
      MYSQL_ROOT_PASSWORD: root # Use the environment variable for the DB password
      MYSQL_DATABASE: advocatus_authentificator_db
    ports:
      - "3307:3306"  # Expose MySQL port 3306 on port 3307
    volumes:
      - db_data:/var/lib/mysql   
    networks:
      - autenticador_network  # Use the shared network

volumes:
  db_data:  # Define the volume for MySQL data persistence

networks:
  autenticador_network: